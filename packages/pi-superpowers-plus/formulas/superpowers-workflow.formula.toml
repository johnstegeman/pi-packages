formula = "superpowers-workflow"
description = "Brainstorm -> design -> plan -> implement -> wrap-up -> verify -> finish"
version = 2
type = "workflow"

[vars.topic]
description = "The feature/topic being brainstormed"
required = true

[[steps]]
id = "conversation"
title = "Draw out intent: {{topic}}"
type = "task"

[[steps]]
id = "playback"
title = "Play back understanding"
type = "task"
needs = ["conversation"]

[[steps]]
id = "design-approved"
title = "User approves the full description"
type = "task"
needs = ["playback"]

[steps.gate]
type = "human"

[[steps]]
id = "write-spec"
title = "Write spec to docs/superpowers/specs/"
type = "task"
needs = ["design-approved"]

[[steps]]
id = "spec-review"
title = "Builder check"
type = "task"
needs = ["write-spec"]

[[steps]]
id = "spec-approved"
title = "User reviews written spec"
type = "task"
needs = ["spec-review"]

[steps.gate]
type = "human"

[[steps]]
id = "implement"
title = "Implement {{topic}}"
type = "task"
needs = ["spec-approved"]

[[steps]]
id = "wrap-up"
title = "Wrap up: disposition all parked findings"
type = "task"
needs = ["implement"]

[[steps]]
id = "verify"
title = "Verify"
type = "task"
needs = ["wrap-up"]

[[steps]]
id = "smoke-test-approved"
title = "Smoke test / manual QA sign-off"
type = "task"
needs = ["verify"]

[steps.gate]
type = "human"

[[steps]]
id = "finish"
title = "Finish development branch"
type = "task"
needs = ["smoke-test-approved"]
