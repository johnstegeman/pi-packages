name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest / registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root manifest and resolve registered paths
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # ${section}/${p} template literals inside single-quoted node -e
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const errors = [];
            for (const section of ["extensions", "themes", "skills", "prompts"]) {
              for (const p of pkg.pi?.[section] ?? []) {
                if (!existsSync(p)) errors.push(`pi.${section} path does not exist: ${p}`);
              }
            }
            if (errors.length) { console.error(errors.join("\n")); process.exit(1); }
            console.log("manifest OK: parses and all registered paths resolve");
          '

  deps-mirror:
    name: Subtree deps mirrored in root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache semver helper
        id: depsmirror-cache
        uses: actions/cache@v4
        with:
          path: /tmp/depsmirror
          key: depsmirror-semver7-${{ runner.os }}-v1
      - name: Install semver helper
        if: steps.depsmirror-cache.outputs.cache-hit != 'true'
        run: npm install --no-save semver@^7 --prefix /tmp/depsmirror --silent
      - name: Run dep-mirror gate
        env:
          NODE_PATH: /tmp/depsmirror/node_modules
        run: node scripts/ci/check-deps-mirror.mjs
      - name: Run dep-mirror tests
        env:
          NODE_PATH: /tmp/depsmirror/node_modules
        run: node --test scripts/ci/check-deps-mirror.test.mjs

  subtree-smoke:
    name: Subtree install + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pi-subagents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/pi-subagents/package-lock.json
      - name: Install subtree deps
        run: npm ci
      - name: Typecheck subtree
        run: npm run typecheck

  sim:
    name: Sync-loop simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sync sim (happy path + failure scenarios)
        run: bash scripts/sim/simulate-sync.sh

  workflow-lint:
    name: Actionlint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint (pinned v1.7.12)
        run: |
          set -euo pipefail
          ALV=v1.7.12
          ALV_NUM="${ALV#v}"
          curl -fsSL -o "actionlint_${ALV_NUM}_linux_amd64.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/${ALV}/actionlint_${ALV_NUM}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${ALV}/actionlint_${ALV_NUM}_checksums.txt" \
            | grep -F "actionlint_${ALV_NUM}_linux_amd64.tar.gz" > checksums.txt
          sha256sum -c checksums.txt
          tar -xzf "actionlint_${ALV_NUM}_linux_amd64.tar.gz"
          sudo mv actionlint /usr/local/bin/
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  gates-list:
    name: Package gate inventory
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List gated packages
        id: list
        run: |
          set -euo pipefail
          packages="$(node scripts/ci/package-gate.mjs --list --json)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  package-gates:
    name: Package gate (${{ matrix.package }})
    needs: gates-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.gates-list.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - name: Gate ${{ matrix.package }}
        run: node scripts/ci/package-gate.mjs "${{ matrix.package }}"
