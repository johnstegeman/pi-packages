name: Sync pi-subagents

on:
  schedule:
    - cron: '0 4 * * *'   # nightly 04:00 UTC
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pi-subagents
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git subtree needs the full history
          ref: main

      - name: Configure git bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run merge-onto-branch sync
        id: sync
        env:
          UPSTREAM_REPO: https://github.com/tintinweb/pi-subagents.git
          UPSTREAM_REF: master
        run: |
          set -euo pipefail
          chmod +x scripts/sync/sync-subtree.sh
          OUT="$(./scripts/sync/sync-subtree.sh)"
          echo "$OUT"
          echo "changed=$(echo "$OUT" | sed -n 's/^changed=//p')" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(echo "$OUT" | sed -n 's/^upstream_sha=//p')" >> "$GITHUB_OUTPUT"

      - name: Open or refresh pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY="Automated \`git subtree pull\` of tintinweb/pi-subagents@${{ steps.sync.outputs.upstream_sha }}.

          This PR was built by merging upstream onto the persistent \`bot/update-pi-subagents\` branch (never force-pushed), so any dep-mirror fix you commit here survives nightly reruns.

          If this PR adds or removes runtime dependencies, mirror them into root
          package.json \`dependencies\` (croner, nanoid, @sinclair/typebox, typebox).
          The deps-mirror CI job gates this automatically."
          EXISTING=$(gh pr list --head bot/update-pi-subagents --state open --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create --base main --head bot/update-pi-subagents \
              --title "chore: sync pi-subagents from upstream" \
              --body "$BODY"
          else
            gh pr edit "$EXISTING" --body "$BODY"
          fi
